<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles'); ?>
  <!-- QRコードはこのライブラリでブラウザ内で生成する。氏名やトークンは外部サービスへ送らない。 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { text-align: left; }
    .tabs { display: flex; gap: 8px; padding: 16px; background: white; border-bottom: 1px solid #ddd; }
    .tab-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid #ccc; background: #f0f0f0; cursor: pointer; font-size: 15px; }
    .tab-btn.active { background: #1a73e8; color: white; border-color: #1a73e8; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .login-box { max-width: 420px; margin: 80px auto; text-align: center; }
    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 13px; margin-right: 4px; }
    .btn.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    .btn.danger { background: #d32f2f; color: white; border-color: #d32f2f; }
    .inline-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .inline-form input, .inline-form select { font-size: 14px; padding: 8px; width: auto; }
    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block; position: absolute; top: 0; left: 0; }
    }
    .print-card {
      width: 9cm; height: 5.5cm; border: 2px dashed #999; display: inline-flex;
      flex-direction: column; align-items: center; justify-content: center;
      margin: 8px; page-break-inside: avoid;
    }
    .print-card .name { font-size: 24px; font-weight: bold; margin-top: 8px; }
    .qr-holder { width: 140px; height: 140px; }
  </style>
</head>
<body>
  <div id="loginBox" class="login-box">
    <div id="setupMode" style="display:none;">
      <h2>はじめに管理者パスワードを設定してください</h2>
      <div class="form-block" style="margin:0 auto;">
        <input type="password" id="setupPassword" placeholder="新しい管理者パスワード（4文字以上）">
      </div>
      <button class="big-button" style="font-size:18px; padding:12px 24px;" onclick="setupPassword()">設定する</button>
      <div id="setupMessage" style="margin-top:12px; color:#c0392b;"></div>
    </div>
    <div id="loginMode" style="display:none;">
      <h2>管理画面ログイン</h2>
      <div class="form-block" style="margin:0 auto;">
        <input type="password" id="loginPassword" placeholder="管理者パスワード">
      </div>
      <button class="big-button" style="font-size:18px; padding:12px 24px;" onclick="login()">ログイン</button>
      <div id="loginMessage" style="margin-top:12px; color:#c0392b;"></div>
    </div>
  </div>

  <div id="adminBody" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="staff">スタッフ管理</button>
      <button class="tab-btn" data-tab="temp">臨時割当</button>
      <button class="tab-btn" data-tab="device">端末管理</button>
      <button class="tab-btn" data-tab="settings">設定</button>
    </div>

    <div class="admin-section">
      <div id="tab-staff" class="tab-content active">
        <h2>スタッフ一覧</h2>
        <div class="inline-form">
          <input type="text" id="newStaffName" placeholder="氏名（フルネーム）">
          <input type="text" id="newStaffShiftName" placeholder="シフト表での表記">
          <select id="newStaffCategory">
            <option value="社員">社員</option>
            <option value="パート" selected>パート</option>
            <option value="臨時">臨時</option>
          </select>
          <button class="btn primary" onclick="addStaff()">追加</button>
        </div>
        <button class="btn" onclick="printAllCards()">在籍スタッフのQRカードを一括印刷</button>
        <table id="staffTable">
          <thead><tr><th>ID</th><th>氏名</th><th>シフト表表記</th><th>区分</th><th>在籍</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="tab-temp" class="tab-content">
        <h2>臨時割当（予備カード 臨時1〜5）</h2>
        <p>スポットで来た方の氏名と対象日を入力してください。対象日が今日でない割当は自動的に無効になります。</p>
        <table id="tempTable">
          <thead><tr><th>カード</th><th>氏名</th><th>対象日</th><th>状態</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="tab-device" class="tab-content">
        <h2>登録済み端末</h2>
        <table id="deviceTable">
          <thead><tr><th>端末名</th><th>登録日時</th><th>最終利用</th><th>状態</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
        <p>新しい端末は、その端末の Safari で <code>?page=device</code> を開いて登録してください。</p>
      </div>

      <div id="tab-settings" class="tab-content">
        <h2>設定</h2>
        <label>
          <input type="checkbox" id="nameButtonToggle" onchange="updateNameButtonSetting()">
          名前ボタン方式を有効にする（カード忘れ・スキャナ故障時の保険）
        </label>
      </div>
    </div>
  </div>

  <div id="printArea"></div>

  <script>
    var sessionToken = '';

    function checkPasswordSet() {
      google.script.run
        .withSuccessHandler(function (isSet) {
          document.getElementById(isSet ? 'loginMode' : 'setupMode').style.display = 'block';
        })
        .isAdminPasswordSet();
    }
    checkPasswordSet();

    function setupPassword() {
      var pw = document.getElementById('setupPassword').value;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res.ok) {
            document.getElementById('setupMode').style.display = 'none';
            document.getElementById('loginMode').style.display = 'block';
          } else {
            document.getElementById('setupMessage').textContent = res.message;
          }
        })
        .setInitialAdminPassword(pw);
    }

    function login() {
      var pw = document.getElementById('loginPassword').value;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res.ok) {
            sessionToken = res.sessionToken;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminBody').style.display = 'block';
            loadAll();
          } else {
            document.getElementById('loginMessage').textContent = res.message;
          }
        })
        .adminLogin(pw);
    }

    // ---- タブ切り替え ----
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    function loadAll() {
      loadStaff();
      loadTemp();
      loadDevices();
      loadSettings();
    }

    // ---- スタッフ ----
    function loadStaff() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) return;
          var tbody = document.querySelector('#staffTable tbody');
          tbody.innerHTML = '';
          res.staff.forEach(function (s) {
            var tr = document.createElement('tr');
            tr.innerHTML =
              '<td>' + s.id + '</td>' +
              '<td>' + s.name + '</td>' +
              '<td>' + s.shiftName + '</td>' +
              '<td>' + s.category + '</td>' +
              '<td><span class="pill ' + (s.active ? 'active' : 'inactive') + '">' + (s.active ? '在籍' : '退職') + '</span></td>' +
              '<td></td>';
            var actionsTd = tr.querySelector('td:last-child');

            var toggleBtn = document.createElement('button');
            toggleBtn.className = 'btn';
            toggleBtn.textContent = s.active ? '在籍OFF' : '在籍ON';
            toggleBtn.onclick = function () { toggleStaffActive(s.id, !s.active); };
            actionsTd.appendChild(toggleBtn);

            var regenBtn = document.createElement('button');
            regenBtn.className = 'btn';
            regenBtn.textContent = 'カード再発行';
            regenBtn.onclick = function () { regenerateToken(s.id, s.name); };
            actionsTd.appendChild(regenBtn);

            var printBtn = document.createElement('button');
            printBtn.className = 'btn';
            printBtn.textContent = 'カード印刷';
            printBtn.onclick = function () { printOneCard(s.id); };
            actionsTd.appendChild(printBtn);

            tbody.appendChild(tr);
          });
        })
        .adminListStaff(sessionToken);
    }

    function addStaff() {
      var name = document.getElementById('newStaffName').value.trim();
      var shiftName = document.getElementById('newStaffShiftName').value.trim();
      var category = document.getElementById('newStaffCategory').value;
      if (!name) { alert('氏名を入力してください'); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res.ok) {
            document.getElementById('newStaffName').value = '';
            document.getElementById('newStaffShiftName').value = '';
            loadStaff();
          } else {
            alert(res.message);
          }
        })
        .adminAddStaff(sessionToken, name, shiftName, category);
    }

    function toggleStaffActive(id, active) {
      google.script.run.withSuccessHandler(loadStaff).adminSetStaffActive(sessionToken, id, active);
    }

    function regenerateToken(id, name) {
      if (!confirm(name + ' さんのカードを再発行します。古いカードは使えなくなります。よろしいですか？')) return;
      google.script.run
        .withSuccessHandler(function () {
          loadStaff();
          alert('再発行しました。新しいカードを印刷してください。');
        })
        .adminRegenerateToken(sessionToken, id);
    }

    // ---- QRカード印刷（外部サービスを使わずブラウザ内で生成） ----
    function printOneCard(id) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) { alert(res.message); return; }
          renderPrintCards([res]);
        })
        .adminGetStaffCard(sessionToken, id);
    }

    function printAllCards() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) { alert(res.message); return; }
          renderPrintCards(res.cards);
        })
        .adminGetAllStaffCards(sessionToken);
    }

    function renderPrintCards(cards) {
      var area = document.getElementById('printArea');
      area.innerHTML = '';
      cards.forEach(function (c) {
        var card = document.createElement('div');
        card.className = 'print-card';
        var qrHolder = document.createElement('div');
        qrHolder.className = 'qr-holder';
        card.appendChild(qrHolder);
        var nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = c.name;
        card.appendChild(nameEl);
        area.appendChild(card);
        new QRCode(qrHolder, { text: c.token, width: 140, height: 140 });
      });
      setTimeout(function () { window.print(); }, 300);
    }

    // ---- 臨時割当 ----
    function loadTemp() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) return;
          var tbody = document.querySelector('#tempTable tbody');
          tbody.innerHTML = '';
          res.assignments.forEach(function (a) {
            var tr = document.createElement('tr');
            var nameCell = document.createElement('td');
            var nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.value = a.name || '';
            nameInput.id = 'temp-name-' + a.cardId;
            nameCell.appendChild(nameInput);

            var dateCell = document.createElement('td');
            var dateInput = document.createElement('input');
            dateInput.type = 'date';
            dateInput.value = a.date || '';
            dateInput.id = 'temp-date-' + a.cardId;
            dateCell.appendChild(dateInput);

            var idCell = document.createElement('td');
            idCell.textContent = a.cardId;

            var statusCell = document.createElement('td');
            statusCell.innerHTML = a.isToday
              ? '<span class="pill active">本日有効</span>'
              : '<span class="pill inactive">無効</span>';

            var actionCell = document.createElement('td');
            var saveBtn = document.createElement('button');
            saveBtn.className = 'btn primary';
            saveBtn.textContent = '保存';
            saveBtn.onclick = function () { saveTemp(a.cardId); };
            actionCell.appendChild(saveBtn);

            tr.appendChild(idCell);
            tr.appendChild(nameCell);
            tr.appendChild(dateCell);
            tr.appendChild(statusCell);
            tr.appendChild(actionCell);
            tbody.appendChild(tr);
          });
        })
        .adminListTempAssignments(sessionToken);
    }

    function saveTemp(cardId) {
      var name = document.getElementById('temp-name-' + cardId).value.trim();
      var date = document.getElementById('temp-date-' + cardId).value;
      google.script.run.withSuccessHandler(loadTemp).adminSetTempAssignment(sessionToken, cardId, name, date);
    }

    // ---- 端末 ----
    function loadDevices() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) return;
          var tbody = document.querySelector('#deviceTable tbody');
          tbody.innerHTML = '';
          res.devices.forEach(function (d) {
            var tr = document.createElement('tr');
            tr.innerHTML =
              '<td>' + d.name + '</td>' +
              '<td>' + d.registeredAt + '</td>' +
              '<td>' + d.lastUsedAt + '</td>' +
              '<td>' + (d.active ? '<span class="pill active">有効</span>' : '<span class="pill inactive">失効</span>') + '</td>' +
              '<td></td>';
            var actionsTd = tr.querySelector('td:last-child');
            if (d.active) {
              var btn = document.createElement('button');
              btn.className = 'btn danger';
              btn.textContent = '失効させる';
              btn.onclick = function () {
                if (confirm(d.name + ' を失効させますか？')) {
                  google.script.run.withSuccessHandler(loadDevices).adminRevokeDevice(sessionToken, d.id);
                }
              };
              actionsTd.appendChild(btn);
            }
            tbody.appendChild(tr);
          });
        })
        .adminListDevices(sessionToken);
    }

    // ---- 設定 ----
    function loadSettings() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.ok) return;
          document.getElementById('nameButtonToggle').checked = res.nameButtonEnabled;
        })
        .adminGetSettings(sessionToken);
    }

    function updateNameButtonSetting() {
      var enabled = document.getElementById('nameButtonToggle').checked;
      google.script.run.adminUpdateNameButtonSetting(sessionToken, enabled);
    }
  </script>
</body>
</html>
